name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (for example, v1.3.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      asset: ${{ steps.build.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test, and validate
        id: build
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag || '' }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ${{ steps.build.outputs.asset }}
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: package
      - name: Upload draft then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(contents)' > release-notes.md
          if [[ "$(cat release-notes.md)" == "Release $RELEASE_TAG" ]]; then
            previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)"
            {
              echo "## What's changed"
              echo
              if [[ -n "$previous_tag" ]]; then
                git log --no-merges --invert-grep --grep='^Prepare release v' --pretty='- %s (`%h`)' "$previous_tag..$RELEASE_TAG"
                echo
                echo "**Full changelog:** https://github.com/$GH_REPO/compare/$previous_tag...$RELEASE_TAG"
              else
                git log --no-merges --invert-grep --grep='^Prepare release v' --pretty='- %s (`%h`)' "$RELEASE_TAG"
              fi
            } > release-notes.md
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" package/latest.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
